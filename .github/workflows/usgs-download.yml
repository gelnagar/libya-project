name: Download declassified satellite frames
# Download each frame in archive/maps/usgs-picks.json, find Tripoli on it, cut it out, line it up with today's
# imagery and tile it. Each step skips frames that are already done, so re-running is cheap.
on:
  workflow_dispatch: { inputs: { only: { description: 'Pick ids to run, comma separated (blank = all)', required: false, default: '' } } }
  push: { paths: [archive/maps/usgs-picks.json, scripts/usgs-download.py, scripts/usgs-register.py, .github/workflows/usgs-download.yml] }
permissions: { contents: write }
concurrency: { group: usgs-download, cancel-in-progress: false }
jobs:
  frames:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      # the branch tip, not the commit that triggered the run, so a queued run sees what the run before it committed
      - uses: actions/checkout@v4
        with: { ref: '${{ github.ref_name }}' }
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq gdal-bin python3-gdal python3-numpy python3-opencv python3-shapely jq file >/dev/null
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      # the frames are 2-5 GB each; /mnt has far more room than the checkout's disk
      - run: sudo mkdir -p /mnt/usgs && sudo chown "$USER" /mnt/usgs && df -h / /mnt
      - name: Download, find Tripoli, cut out
        run: python3 scripts/usgs-download.py
        env:
          USGS_USERNAME: '${{ secrets.USGS_USERNAME || vars.USGS_USERNAME }}'
          USGS_TOKEN: '${{ secrets.USGS_TOKEN || vars.USGS_TOKEN }}'
          USGS_WORK: /mnt/usgs
          USGS_ONLY: '${{ inputs.only }}'
          GH_TOKEN: '${{ github.token }}'
      - name: Line up with today's imagery
        run: python3 scripts/usgs-register.py
        env:
          USGS_USERNAME: '${{ secrets.USGS_USERNAME || vars.USGS_USERNAME }}'
          USGS_TOKEN: '${{ secrets.USGS_TOKEN || vars.USGS_TOKEN }}'
          USGS_WORK: /mnt/usgs
          USGS_ONLY: '${{ inputs.only }}'
          GH_TOKEN: '${{ github.token }}'
      - name: Tile
        run: OVERLAY_ONLY=$(jq -r 'map(.id) | join(",")' archive/maps/usgs-picks.json) ./scripts/build-overlays.sh
        continue-on-error: true
      - run: node scripts/build-overlays-index.mjs && node --check public/data/overlays.js && node --check public/app.js
      - if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # one path at a time: a single missing path would make git add skip all of them
          for p in archive/maps/preview/usgs archive/maps/overlays.json archive/maps/usgs-download-status.json archive/maps/usgs-register-status.json public/maps public/data/overlays.js; do [ -e "$p" ] && git add "$p"; done
          if git diff --cached --quiet; then echo none; exit 0; fi
          git commit -m "Declassified satellite frames: cut, lined up and tiled"
          # other jobs (map overlays, research slices) push to the same branch; retry instead of failing on a race
          for i in 1 2 3 4 5; do git pull --rebase && git push && exit 0; sleep $((i * 10)); done
          exit 1
