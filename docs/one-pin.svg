<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 260" font-family="Consolas, Menlo, monospace"><rect width="900" height="260" fill="#0b0f14"/><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8z" fill="#5fb3b3"/></marker></defs>
