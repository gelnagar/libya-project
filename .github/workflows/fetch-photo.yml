name: Fetch thumbnail photo
on: { workflow_dispatch: {}, push: { branches: [main], paths: [.github/workflows/fetch-photo.yml] } }
permissions: { contents: write }
jobs:
  photo:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - run: |
          mkdir -p public/img
          curl -sSL -A "TripoliOpenSource/1.0 (github.com/gelnagar/libya-project)" -o public/img/federation-1971.jpg "https://commons.wikimedia.org/wiki/Special:FilePath/Sadat_Qaddafi_Assad_1971.jpg?width=900"
          file public/img/federation-1971.jpg
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/img
          if git diff --cached --quiet; then echo none; else git commit -m "1971 photo" && git pull --rebase && git push; fi
