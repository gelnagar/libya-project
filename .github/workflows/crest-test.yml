name: CREST page test
on: { workflow_dispatch: {} }
permissions: { contents: write }
concurrency: { group: cia-gov, cancel-in-progress: false }
jobs:
  t:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: node scripts/crest-test.mjs
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for i in 1 2 3; do git add archive/crest && git commit -m "CREST page test" ; git pull --rebase && git push && break; sleep 5; done
