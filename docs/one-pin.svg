<g fill="#c9d6df" font-size="12"><text x="36" y="55" fill="#5fb3b3" font-size="11">WHAT THE DOCUMENT SAYS</text>
<text x="36" y="85">"... security forces killed an estimated</text><text x="36" y="103">1,200 or more inmates in the prison courtyards"</text>
<text x="36" y="140" fill="#7f8c97">Sources: Human Rights Watch, Amnesty,</text><text x="36" y="158" fill="#7f8c97">U.S. State Dept., survivor interviews</text>
<text x="36" y="196" fill="#7f8c97">Sources disagree on the date and toll.</text><text x="36" y="214" fill="#7f8c97">Both versions are kept.</text>
<text x="496" y="55" fill="#e0b252" font-size="11">WHAT THE MAP SHOWS</text>
<text x="496" y="85">Pin: Abu Salim prison, Tripoli</text><text x="496" y="108">Layer: killings and repression</text><text x="496" y="131">Evidence: DOCUMENTED</text><text x="496" y="154">Date: 28-29 June 1996</text><text x="496" y="177">Toll: up to 1,200 (estimate)</text><text x="496" y="200">Position: the site, within 1 km</text></g>
