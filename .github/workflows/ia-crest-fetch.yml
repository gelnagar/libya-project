name: Fetch CREST/JPRS text (archive.org mirror)
on: { workflow_dispatch: {} }
permissions: { contents: write }
concurrency: { group: ia-crest, cancel-in-progress: false }
jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: node scripts/ia-crest-fetch.mjs
      - if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for i in 1 2 3; do git add archive/crest && git commit -m "CREST/JPRS text from archive.org mirror" ; git pull --rebase && git push && break; sleep 5; done
