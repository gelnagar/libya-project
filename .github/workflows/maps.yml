name: Build historical map overlays
on:
  workflow_dispatch: {}
  push: { branches: [main], paths: [archive/maps/overlays.json, scripts/build-overlays.sh, scripts/discover-maps.mjs, scripts/build-landsat.py, .github/workflows/maps.yml] }
permissions: { contents: write }
concurrency: { group: maps, cancel-in-progress: false }
jobs:
  tiles:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq gdal-bin python3-gdal python3-numpy jq unzip file pngquant >/dev/null
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: node scripts/discover-maps.mjs
        continue-on-error: true
      - run: ./scripts/build-overlays.sh
        continue-on-error: true
      - run: python3 scripts/build-landsat.py
        continue-on-error: true
      - run: node scripts/build-overlays-index.mjs
      - if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/maps archive/maps public/data/overlays.js
          if git diff --cached --quiet; then echo "No changes"; else git commit -m "Build historical map overlays" && git pull --rebase && git push; fi
