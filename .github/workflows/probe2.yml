name: Probe government pages
on: { workflow_dispatch: {}, push: { branches: [main], paths: [scripts/probe2.mjs, .github/workflows/probe2.yml] } }
permissions: { contents: write }
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: node scripts/probe2.mjs
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add archive/probe2.json && git commit -m "Probe government pages" && git pull --rebase && git push
