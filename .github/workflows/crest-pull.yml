name: Pull more CREST (full-text discovery + fetch)
on: { workflow_dispatch: {} }
permissions: { contents: write }
concurrency: { group: ia-crest, cancel-in-progress: false }
jobs:
  pull:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: node scripts/ia-crest-fts.mjs
      - name: save discovery list
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for i in 1 2 3; do git add archive/crest && git commit -m "CREST discovery list" ; git pull --rebase && git push && break; sleep 5; done
      - run: node scripts/ia-crest-fetch.mjs
      - if: always()
        run: |
          for i in 1 2 3 4; do git add archive/crest && git commit -m "CREST text pull" ; git pull --rebase && git push && break; sleep 8; done
