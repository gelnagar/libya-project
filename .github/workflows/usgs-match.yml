name: Match declassified frames (learned matcher)
# Proposes landmarks between a film overview and the aligned layers / today's imagery with LoFTR (Kornia, PyTorch on CPU).
# Needs archive/maps/seeds/<frame>.json (a few hand-marked landmarks). Writes archive/maps/matches/<frame>-<reference>-<matcher>.json.
on:
  workflow_dispatch:
    inputs:
      frame: { description: 'Frame id, e.g. kh9-1976-north', required: true, default: 'kh9-1976-north' }
      refs: { description: 'References, space separated: layers esri', required: false, default: 'layers esri' }
      matcher: { description: 'loftr or sift', required: false, default: 'loftr' }
permissions: { contents: write }
concurrency: { group: 'usgs-match-${{ inputs.frame }}', cancel-in-progress: false }
jobs:
  match:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
        with: { ref: '${{ github.ref_name }}' }
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq python3-venv >/dev/null
      - run: |
          python3 -m venv venv
          venv/bin/pip install -q torch --index-url https://download.pytorch.org/whl/cpu
          venv/bin/pip install -q numpy opencv-python-headless kornia
          venv/bin/python -c "import torch, kornia; print('torch', torch.__version__, 'kornia', kornia.__version__)"
      - name: Match
        run: venv/bin/python scripts/usgs-match.py "$FRAME" $REFS "--matcher=$MATCHER"
        env:
          FRAME: '${{ inputs.frame }}'
          REFS: '${{ inputs.refs }}'
          MATCHER: '${{ inputs.matcher }}'
      - if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          [ -d archive/maps/matches ] && git add archive/maps/matches
          if git diff --cached --quiet; then echo none; exit 0; fi
          git commit -m "Landmark candidates from the learned matcher"
          for i in 1 2 3 4 5; do git pull --rebase && git push && exit 0; sleep $((i * 10)); done
          exit 1
