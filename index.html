<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0a0e13">
<title>Tripoli Security Atlas 1969–1989</title>
<link rel="stylesheet" href="vendor/leaflet/leaflet.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans+Condensed:wght@500;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
/* Layout: full-screen map; layers panel slides up from the bottom on phones and docks left on desktop; site details slide up on phones and dock right on desktop. */
:root {
  --bg: #0a0e13;
  --panel: #10161e;
  --panel-2: #161e28;
  --line: #243142;
  --text: #e8eef4;
  --muted: #93a3b5;
  --accent: #5ab8ff;
  --focus: #ffd166;
  --f-ui: "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --f-head: "IBM Plex Sans Condensed", "Arial Narrow", system-ui, sans-serif;
  --f-data: "IBM Plex Mono", ui-monospace, Menlo, monospace;
  --fs: 17px;
  --bar-h: 56px;
  --banner-h: 0px;
  --top: env(safe-area-inset-top, 0px);
  --bot: env(safe-area-inset-bottom, 0px);
  color-scheme: dark;
}
html.big { --fs: 20px; }
html.huge { --fs: 23px; }
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { height: 100%; margin: 0; background: var(--bg); color: var(--text); font-family: var(--f-ui); font-size: var(--fs); line-height: 1.5; -webkit-text-size-adjust: 100%; }
button, input, textarea, select { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 3px solid var(--focus); outline-offset: 2px; }
a { color: var(--accent); }

.bar {
  position: fixed; inset: 0 0 auto 0; z-index: 1000; height: calc(var(--bar-h) + var(--top));
  padding: var(--top) max(12px, env(safe-area-inset-right, 0px)) 0 max(12px, env(safe-area-inset-left, 0px));
  display: flex; align-items: center; justify-content: space-between; gap: 10px;
  background: var(--panel); border-bottom: 1px solid var(--line);
}
.brand { display: flex; align-items: center; gap: 10px; min-width: 0; }
.brand i { width: 10px; height: 10px; background: var(--accent); box-shadow: 0 0 0 3px rgba(90,184,255,.2); flex: none; }
.brand b { font-family: var(--f-head); font-weight: 600; letter-spacing: .06em; font-size: 1em; display: block; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.brand small { display: block; font-family: var(--f-data); font-size: .62em; color: var(--muted); letter-spacing: .08em; text-transform: uppercase; white-space: nowrap; }
.bar-actions { display: flex; gap: 8px; flex: none; }
.btn {
  min-height: 44px; padding: 0 16px; border: 1px solid var(--line); background: var(--panel-2);
  font-weight: 600; font-size: .9em; letter-spacing: .02em; border-radius: 3px;
}
.btn:active { background: var(--line); }
.btn.primary { background: var(--accent); color: #04121f; border-color: var(--accent); }
.btn.icon { width: 44px; padding: 0; font-size: 1.1em; }

#map { position: fixed; top: calc(var(--bar-h) + var(--top) + var(--banner-h)); left: 0; right: 0; bottom: 0; background: #0d1218; }

/* panels */
.panel {
  position: fixed; z-index: 1100; background: var(--panel); border: 1px solid var(--line);
  display: flex; flex-direction: column; min-height: 0;
}
.panel-head { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 12px 16px; border-bottom: 1px solid var(--line); flex: none; }
.panel-head h2 { margin: 0; font-family: var(--f-head); font-size: 1.05em; letter-spacing: .06em; text-transform: uppercase; }
.panel-body { overflow-y: auto; -webkit-overflow-scrolling: touch; padding: 14px 16px calc(20px + var(--bot)); display: flex; flex-direction: column; gap: 20px; min-height: 0; }
.grab { display: none; width: 44px; height: 5px; border-radius: 3px; background: var(--line); margin: 8px auto 0; }

@media (max-width: 899px) {
  .panel { left: 0; right: 0; bottom: 0; border-radius: 12px 12px 0 0; border-bottom: 0; max-height: 78vh; transform: translateY(105%); transition: transform .25s ease; }
  .panel.open { transform: none; }
  #sheet { max-height: 64vh; }
  .grab { display: block; }
}
@media (min-width: 900px) {
  #drawer { top: calc(var(--bar-h) + var(--top) + var(--banner-h) + 12px); left: 12px; bottom: 12px; width: 340px; border-radius: 4px; }
  #drawer:not(.open) { display: none; }
  #sheet { top: calc(var(--bar-h) + var(--top) + var(--banner-h) + 12px); right: 12px; bottom: 12px; width: 410px; border-radius: 4px; }
  #sheet:not(.open) { display: none; }
}
@media (prefers-reduced-motion: reduce) { .panel { transition: none; } }

.sec h3 { margin: 0 0 8px; font-family: var(--f-data); font-weight: 500; font-size: .7em; letter-spacing: .14em; text-transform: uppercase; color: var(--muted); }
.basemaps { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.basemaps button { min-height: 52px; border: 1px solid var(--line); background: var(--panel-2); border-radius: 3px; font-weight: 600; text-align: left; padding: 8px 12px; }
.basemaps button[aria-pressed="true"] { border-color: var(--accent); box-shadow: inset 0 0 0 1px var(--accent); }
.basemaps small { display: block; font-weight: 400; color: var(--muted); font-size: .75em; }

.toggle { display: flex; align-items: center; gap: 12px; min-height: 52px; padding: 6px 4px; border-bottom: 1px solid var(--line); cursor: pointer; }
.toggle:last-child { border-bottom: 0; }
.toggle input { width: 26px; height: 26px; accent-color: var(--accent); flex: none; margin: 0; }
.toggle .sw { width: 22px; height: 22px; flex: none; border-radius: 50%; display: grid; place-items: center; font: 600 12px var(--f-data); color: #0a0e13; }
.toggle .sw.sq { border-radius: 3px; }
.toggle span.t { flex: 1; min-width: 0; }
.toggle small { display: block; color: var(--muted); font-size: .78em; line-height: 1.35; }

.places { display: flex; flex-direction: column; }
.places button { display: flex; align-items: center; gap: 12px; text-align: left; min-height: 48px; padding: 8px 4px; background: none; border: 0; border-bottom: 1px solid var(--line); }
.places button:last-child { border-bottom: 0; }

/* detail sheet */
.tags { display: flex; flex-wrap: wrap; gap: 6px; }
.tag { font: 500 .68em var(--f-data); letter-spacing: .1em; text-transform: uppercase; padding: 4px 8px; border: 1px solid currentColor; border-radius: 2px; }
.d-title { margin: 0; font-family: var(--f-head); font-size: 1.45em; line-height: 1.15; text-wrap: balance; }
.d-ar { font-size: 1.05em; color: var(--muted); margin-top: 2px; }
.meta { display: grid; grid-template-columns: auto 1fr; gap: 4px 14px; font: .78em var(--f-data); color: var(--muted); margin: 0; }
.meta dt { text-transform: uppercase; letter-spacing: .08em; }
.meta dd { margin: 0; color: var(--text); font-variant-numeric: tabular-nums; }
.brief { border-left: 3px solid var(--accent); padding: 4px 0 4px 12px; margin: 0; font-size: 1.02em; }
.d-text { margin: 0; color: #d3dce6; }
.srcs { margin: 0; padding-left: 20px; font-size: .88em; display: flex; flex-direction: column; gap: 6px; }
.ai { border: 1px solid var(--line); background: var(--panel-2); padding: 12px; border-radius: 3px; display: flex; flex-direction: column; gap: 10px; }
.ai textarea, .field input { width: 100%; background: var(--bg); border: 1px solid var(--line); border-radius: 3px; padding: 10px; min-height: 48px; }
.ai textarea { min-height: 76px; resize: vertical; }
.ai-out { white-space: pre-wrap; margin: 0; }
.ai-out.err { color: #ff9b94; }
.row-btns { display: flex; gap: 8px; flex-wrap: wrap; }
.row-btns .btn { flex: 1; }
table.kv { width: 100%; border-collapse: collapse; font: .8em var(--f-data); }
table.kv td { border-top: 1px solid var(--line); padding: 6px 4px; vertical-align: top; word-break: break-word; }
table.kv td:first-child { color: var(--muted); width: 40%; }

/* markers & labels */
.mk { width: 34px; height: 34px; display: grid; place-items: center; border-radius: 50%; background: var(--c); border: 3px solid #0a0e13; box-shadow: 0 0 0 1px var(--c), 0 2px 6px rgba(0,0,0,.6); font: 600 14px var(--f-data); color: #0a0e13; transition: transform .15s; }
.mk.l-military, .mk.l-power { border-radius: 4px; }
.mk.v-suspected { background: #0a0e13; color: var(--c); border-color: var(--c); box-shadow: 0 2px 6px rgba(0,0,0,.6); }
.mk.v-testimony { box-shadow: 0 0 0 1px var(--c), 0 0 0 5px rgba(255,255,255,.18); }
.mk.sel { transform: scale(1.3); box-shadow: 0 0 0 3px #fff, 0 0 0 7px var(--c); }
.leaflet-tooltip.site-label { background: rgba(10,14,19,.88); color: var(--text); border: 1px solid var(--line); border-radius: 2px; font: 600 13px var(--f-ui); padding: 3px 7px; box-shadow: none; }
.leaflet-tooltip.site-label::before { display: none; }
.hide-labels .site-label { display: none; }
.district { font: 600 11px var(--f-head); letter-spacing: .14em; text-transform: uppercase; color: rgba(255,255,255,.78); text-shadow: 0 0 3px #000, 0 0 6px #000, 0 0 10px #000; white-space: nowrap; pointer-events: none; text-align: center; }
.district span { display: block; font: 500 11px var(--f-ui); letter-spacing: 0; text-transform: none; opacity: .85; }
.hide-districts .district { display: none; }

/* leaflet chrome */
.leaflet-container { font-family: var(--f-ui); background: #0d1218; }
.leaflet-bar a { width: 44px !important; height: 44px !important; line-height: 44px !important; font-size: 22px !important; background: var(--panel) !important; color: var(--text) !important; border-color: var(--line) !important; }
.leaflet-bar { border: 1px solid var(--line) !important; box-shadow: none !important; }
.leaflet-control-attribution { background: rgba(10,14,19,.75) !important; color: var(--muted) !important; font-size: 10px; }
.leaflet-control-attribution a { color: var(--muted) !important; }
.leaflet-control-scale-line { background: rgba(10,14,19,.75); color: var(--text); border-color: var(--muted); font: 11px var(--f-data); }
@media (max-width: 899px) { .leaflet-top.leaflet-right { margin-top: 6px; } }

.status { position: fixed; z-index: 1050; top: calc(var(--bar-h) + var(--top) + var(--banner-h) + 10px); left: 50%; transform: translateX(-50%); max-width: calc(100% - 120px); background: var(--panel); border: 1px solid var(--line); padding: 8px 14px; border-radius: 3px; font-size: .85em; text-align: center; box-shadow: 0 4px 14px rgba(0,0,0,.5); }

.credit { position: fixed; z-index: 1060; top: calc(var(--bar-h) + var(--top)); left: 0; right: 0; display: flex; align-items: center; gap: 10px; padding: 8px max(12px, env(safe-area-inset-right, 0px)) 8px max(16px, env(safe-area-inset-left, 0px)); background: #ffb224; color: #1a1200; font-weight: 600; font-size: .92em; }
.credit.out { background: #ff5d52; color: #1a0200; }
.credit p { margin: 0; flex: 1; }
.credit .btn { background: transparent; border-color: rgba(0,0,0,.3); color: inherit; }
.tip { position: fixed; z-index: 1200; left: 12px; right: 12px; bottom: calc(16px + var(--bot)); max-width: 460px; margin: 0 auto; background: var(--panel); border: 1px solid var(--accent); padding: 14px 16px; border-radius: 6px; display: flex; gap: 12px; align-items: center; box-shadow: 0 8px 24px rgba(0,0,0,.6); }
.tip p { margin: 0; flex: 1; }

.modal { position: fixed; inset: 0; z-index: 1300; background: rgba(0,0,0,.6); display: grid; place-items: center; padding: 16px; }
.modal-box { width: 100%; max-width: 440px; max-height: 90vh; overflow-y: auto; background: var(--panel); border: 1px solid var(--line); border-radius: 6px; }
.seg { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; }
.seg button { min-height: 48px; border: 1px solid var(--line); background: var(--panel-2); border-radius: 3px; font-weight: 600; }
.seg button[aria-pressed="true"] { border-color: var(--accent); box-shadow: inset 0 0 0 1px var(--accent); }
.field label { display: block; font-weight: 600; margin-bottom: 6px; }
.field small { display: block; color: var(--muted); margin-top: 6px; font-size: .8em; }
</style>
</head>
<body>
<header class="bar">
  <div class="brand"><i aria-hidden="true"></i><div><b>TRIPOLI 1969–1989</b><small>Security &amp; detention atlas</small></div></div>
  <div class="bar-actions">
    <button class="btn" id="btn-layers" aria-controls="drawer" aria-expanded="false">Layers</button>
    <button class="btn icon" id="btn-settings" aria-label="Settings">⚙</button>
  </div>
</header>

<div id="map" aria-label="Map of Tripoli"></div>
<div id="status" class="status" role="status" hidden></div>
<div id="credit" class="credit" role="alert" hidden><p id="credit-msg"></p><button class="btn icon" id="credit-x" aria-label="Hide this message">✕</button></div>

<aside id="drawer" class="panel" aria-label="Map layers">
  <div class="grab" aria-hidden="true"></div>
  <div class="panel-head"><h2>Layers</h2><button class="btn" id="drawer-close">Done</button></div>
  <div class="panel-body">
    <div class="sec">
      <h3>Map style</h3>
      <div class="basemaps" id="basemaps"></div>
    </div>
    <div class="sec">
      <h3>History · 1969–1989</h3>
      <div id="hist-toggles"></div>
    </div>
    <div class="sec">
      <h3>Today · OpenStreetMap</h3>
      <div id="osm-toggles"></div>
    </div>
    <div class="sec">
      <h3>All places</h3>
      <div class="places" id="places"></div>
    </div>
    <button class="btn" id="reset-view">Show all of Tripoli</button>
  </div>
</aside>

<section id="sheet" class="panel" aria-label="Details" aria-live="polite">
  <div class="grab" aria-hidden="true"></div>
  <div class="panel-head"><h2 id="sheet-kind">Details</h2><button class="btn" id="sheet-close">Close</button></div>
  <div class="panel-body" id="sheet-body"></div>
</section>

<div id="tip" class="tip" hidden>
  <p>Tap any marker to read about it. Tap <b>Layers</b> to choose what you see.</p>
  <button class="btn primary" id="tip-ok">Got it</button>
</div>

<div id="settings" class="modal" hidden>
  <div class="modal-box" role="dialog" aria-modal="true" aria-labelledby="set-title">
    <div class="panel-head"><h2 id="set-title">Settings</h2><button class="btn" id="set-close">Done</button></div>
    <div class="panel-body">
      <div class="sec">
        <h3>Text size</h3>
        <div class="seg" id="sizes">
          <button data-size="normal">Normal</button>
          <button data-size="big">Large</button>
          <button data-size="huge">Larger</button>
        </div>
      </div>
      <div class="sec field" id="code-field" hidden>
        <label for="family-code">Family password for AI answers</label>
        <input id="family-code" type="password" autocomplete="off" placeholder="Ask the person who shared this map">
        <small>Saved on this device only.</small>
      </div>
      <button class="btn" id="tip-again">Show the welcome tip again</button>
    </div>
  </div>
</div>

<script src="vendor/leaflet/leaflet.js"></script>
<script src="data/config.js"></script>
<script src="data/sites.js"></script>
<script src="app.js"></script>
</body>
</html>
