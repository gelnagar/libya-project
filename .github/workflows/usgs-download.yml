name: Download declassified satellite frames
on:
  workflow_dispatch: { inputs: { only: { description: 'Pick ids to run, comma separated (blank = all)', required: false, default: '' } } }
  push: { paths: [archive/maps/usgs-picks.json, scripts/usgs-download.py, .github/workflows/usgs-download.yml] }
permissions: { contents: write }
concurrency: { group: usgs-download, cancel-in-progress: false }
jobs:
  frames:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq gdal-bin python3-gdal python3-numpy >/dev/null
      # the frames are 2-5 GB each; /mnt has far more room than the checkout's disk
      - run: sudo mkdir -p /mnt/usgs && sudo chown "$USER" /mnt/usgs && df -h / /mnt
      - run: python3 scripts/usgs-download.py
        env:
          USGS_USERNAME: '${{ secrets.USGS_USERNAME || vars.USGS_USERNAME }}'
          USGS_TOKEN: '${{ secrets.USGS_TOKEN || vars.USGS_TOKEN }}'
          USGS_WORK: /mnt/usgs
          USGS_ONLY: '${{ inputs.only }}'
          GH_TOKEN: '${{ github.token }}'
      - if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add archive/maps/preview/usgs archive/maps/overlays.json archive/maps/usgs-download-status.json 2>/dev/null || true
          if git diff --cached --quiet; then echo none; else git commit -m "Declassified satellite frames: previews and cut-outs" && git pull --rebase && git push; fi
