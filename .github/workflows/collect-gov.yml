name: Collect government documents
on: { workflow_dispatch: {}, push: { branches: [main], paths: [scripts/collect-gov.mjs, .github/workflows/collect-gov.yml] } }
permissions: { contents: write }
concurrency: { group: collect-gov, cancel-in-progress: false }
jobs:
  gov:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: which pdftotext || (sudo apt-get update -qq && sudo apt-get install -y -qq poppler-utils)
      - run: node scripts/collect-gov.mjs
        timeout-minutes: 130
      - if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add archive/gov
          if git diff --cached --quiet; then echo "No changes"; else git commit -m "Collect government documents" && git pull --rebase && git push; fi
