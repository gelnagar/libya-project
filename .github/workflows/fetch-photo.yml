name: Fetch thumbnail photo
on: { workflow_dispatch: {}, push: { branches: [main], paths: [.github/workflows/fetch-photo.yml] } }
permissions: { contents: write }
jobs:
  photo:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - run: |
          mkdir -p public/img archive/research
          UA="TripoliOpenSource/1.0 (github.com/gelnagar/libya-project)"
          curl -sS -A "$UA" "https://commons.wikimedia.org/w/api.php?action=query&format=json&prop=imageinfo&iiprop=url%7Cextmetadata%7Csize&iiurlwidth=600&titles=File:Muammar_Gaddafi_in_1972.jpg%7CFile:Muammar_Gaddafi_in_1972_(cropped).jpg" -o archive/research/photo-meta.json
          python3 - <<'PY'
          import json
          d=json.load(open('archive/research/photo-meta.json'))
          for p in d['query']['pages'].values():
              ii=(p.get('imageinfo') or [{}])[0]; m=ii.get('extmetadata',{})
              print(p['title'], ii.get('width'), ii.get('height'), '|', m.get('LicenseShortName',{}).get('value'), '|', m.get('Artist',{}).get('value','')[:120], '|', m.get('DateTimeOriginal',{}).get('value'), '|', ii.get('thumburl'))
          PY
          curl -sSL -A "$UA" -o public/img/gaddafi-1972.jpg "https://commons.wikimedia.org/wiki/Special:FilePath/Muammar_Gaddafi_in_1972.jpg?width=600"
          file public/img/gaddafi-1972.jpg
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/img archive/research/photo-meta.json
          if git diff --cached --quiet; then echo none; else git commit -m "Candidate 1972 photo and licence data" && git pull --rebase && git push; fi
