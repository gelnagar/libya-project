name: Haiku extraction (CREST/JPRS)
on:
  workflow_dispatch:
    inputs:
      mode: { description: 'sample or batch', default: 'sample' }
      n: { description: 'sample size', default: '30' }
permissions: { contents: write }
concurrency: { group: crest-extract, cancel-in-progress: false }
jobs:
  x:
    runs-on: ubuntu-latest
    timeout-minutes: 340
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - env: { ANTHROPIC_API_KEY: '${{ secrets.ANTHROPIC_API_KEY }}' }
        run: |
          mkdir -p archive/crest; echo "{\"secret_present\": $([ -n \"$ANTHROPIC_API_KEY\" ] && echo true || echo false), \"at\": \"$(date -u +%FT%TZ)\"}" > archive/crest/extract-check.json
          if [ -z "$ANTHROPIC_API_KEY" ]; then echo '{"error":"ANTHROPIC_API_KEY secret missing in GitHub"}' > archive/crest/extract-status.json; else
          if [ "${{ inputs.mode }}" = "batch" ]; then node scripts/crest-extract.mjs --batch; else node scripts/crest-extract.mjs --sample ${{ inputs.n }}; fi; fi
      - if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for i in 1 2 3; do git add archive/crest && git commit -m "Haiku extraction ${{ inputs.mode }}" ; git pull --rebase && git push && break; sleep 5; done
