<text x="95" y="50" fill="#5fb3b3" font-size="11">1 · COLLECT</text><text x="290" y="50" fill="#5fb3b3" font-size="11">2 · READ</text><text x="485" y="50" fill="#5fb3b3" font-size="11">3 · CHECK</text><text x="670" y="50" fill="#5fb3b3" font-size="11">4 · GRADE</text><text x="825" y="50" fill="#e0b252" font-size="11">5 · MAP</text>
<text x="95" y="115">Declassified</text><text x="95" y="132">files, press,</text><text x="95" y="149">human-rights</text><text x="95" y="166">reports</text>
<text x="290" y="115">A small AI</text><text x="290" y="132">fills a form:</text><text x="290" y="149">place, date,</text><text x="290" y="166">exact quote</text>
<text x="485" y="115">Plain code,</text><text x="485" y="132">no AI: is the</text><text x="485" y="149">quote really</text><text x="485" y="166">in the file?</text>
<text x="670" y="115">Source A-F</text><text x="670" y="132">Entry 1-6</text><text x="670" y="149">Unsure =</text><text x="670" y="166">labelled</text>
