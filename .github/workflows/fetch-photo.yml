name: Fetch thumbnail photo
on: { workflow_dispatch: {}, push: { branches: [main], paths: [.github/workflows/fetch-photo.yml] } }
permissions: { contents: write }
jobs:
  photo:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - run: |
          mkdir -p public/img
          curl -sSL -A "TripoliOpenSource/1.0 (github.com/gelnagar/libya-project)" -o public/img/gaddafi-thumb.jpg "https://commons.wikimedia.org/wiki/Special:FilePath/Muammar_al-Gaddafi,_12th_AU_Summit,_090202-N-0506A-534_cropped.jpg?width=240"
          file public/img/gaddafi-thumb.jpg; ls -la public/img
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/img
          if git diff --cached --quiet; then echo none; else git commit -m "Add thumbnail photo (U.S. Navy, public domain)" && git pull --rebase && git push; fi
