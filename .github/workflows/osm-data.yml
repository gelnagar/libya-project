name: Refresh OpenStreetMap data

on:
  workflow_dispatch:
  schedule:
    - cron: '17 3 1 * *'
  push:
    branches: [main]
    paths:
      - scripts/fetch-osm.mjs
      - .github/workflows/osm-data.yml

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node scripts/fetch-osm.mjs
      - name: Save the data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/data/osm
          if git diff --cached --quiet; then echo "No changes"; else git commit -m "Refresh OpenStreetMap data" && git push; fi
