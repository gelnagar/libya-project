name: Mirror probe (archive.org, NARA, DTIC)
on: { workflow_dispatch: {} }
permissions: { contents: write }
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: node scripts/mirror-probe.mjs
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for i in 1 2 3; do git add archive/crest/mirror-probe.json && git commit -m "Mirror probe results" ; git pull --rebase && git push && break; sleep 5; done
